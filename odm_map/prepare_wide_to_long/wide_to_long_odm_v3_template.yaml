# Configuration template for ODM v3 wide to long configuration for make_wide_to_long_config_cli.py.
# To build the final configuration, it uses this config and adds additional keys/values to it.

see_headers:
    aggregation:
        short_name: hAg
        slot: mr_aggregation
    compartment:
        short_name: hCo
        slot: mr_compartment
    fraction:
        short_name: hFr
        slot: mr_fraction
    measure:
        short_name: hMe
        slot: mr_measure
    specimen:
        short_name: hSp
        slot: mr_specimen
    unit:
        short_name: hUn
        slot: mr_unit

custom_id_code:
    - class: qualityReports
      slot: sampleID
      code000: |-
        if dat.qualityReports.has_column("_extra_l_flag") and "l_sampleID" in str(dat.qualityReports._extra_l_flag).split(","):
            target = dat.measures.sampleID
        else:
            target = ""
    - class: qualityReports
      slot: measureRepID
      code000: |-
        if dat.qualityReports.has_column("_extra_l_flag") and "l_measureRepID" in str(dat.qualityReports._extra_l_flag).split(","):
            target = dat.measures.measureRepID
        else:
            target = ""
    - class: qualityReports
      slot: measureSetRepID
      code000: |-
        if dat.qualityReports.has_column("_extra_l_flag") and "l_measureSetRepID" in str(dat.qualityReports._extra_l_flag).split(","):
            target = dat.measureSets.measureSetRepID
        else:
            target = ""
