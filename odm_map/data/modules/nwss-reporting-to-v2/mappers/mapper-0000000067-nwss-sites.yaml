class_derivations:
  sites:
    name: sites
    populated_from: nwss
    slot_derivations:
      notes:
        name: notes
        expr: '"County_names=" + county_names + "; EPA_id=" + epaid + "; EPA_registry_id="
          + epa_registry_id + "; sample_location_specify=" + sample_location_specify'
      popServ:
        name: popServ
        populated_from: population_served
      siteID:
        name: siteID
        populated_from: site_id
      repOrg1:
        name: repOrg1
        populated_from: lab_id
      name:
        name: name
        populated_from: wwtp_name
      siteType:
        name: siteType
        expr: "case(\n    (sample_location == \"wwtp\",\n        case((stormwater_input\
          \ == \"yes\", \"wwtpMuC\"),\n            (stormwater_input == \"no\", \"\
          wwtpMuS\"),\n            (stormwater_input == \"\", \"wwtp\"),\n       \
          \     (True, \"\")\n        )\n    ),\n    (sample_location == \"upstream\"\
          ,\n        case((stormwater_input == \"yes\", \"upstream\"),\n         \
          \   (stormwater_input == \"no\", \"upstream\"),\n            (stormwater_input\
          \ == \"\", \"upstream\"),\n            (True, \"\")\n        )\n    ),\n\
          \    (True, \"\")\n)"
      datasetID:
        name: datasetID
        populated_from: lab_id
      organizationID:
        name: organizationID
        populated_from: lab_id
      contactID:
        name: contactID
        populated_from: reporting_jurisdiction
      sampleShed:
        name: sampleShed
        populated_from: institution_type
  Container:
    name: Container
    slot_derivations:
      sites:
        populated_from: nwss
