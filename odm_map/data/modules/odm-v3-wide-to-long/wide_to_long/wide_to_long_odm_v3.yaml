custom_id_code:
- class: qualityReports
  slot: sampleID
  code000: "if dat.qualityReports.has_column(\"_extra_l_flag\") and \"l_sampleID\"\
    \ in str(dat.qualityReports._extra_l_flag).split(\",\"):\n    target = dat.measures.sampleID\n\
    else:\n    target = \"\""
- class: qualityReports
  slot: measureRepID
  code000: "if dat.qualityReports.has_column(\"_extra_l_flag\") and \"l_measureRepID\"\
    \ in str(dat.qualityReports._extra_l_flag).split(\",\"):\n    target = dat.measures.measureRepID\n\
    else:\n    target = \"\""
- class: qualityReports
  slot: measureSetRepID
  code000: "if dat.qualityReports.has_column(\"_extra_l_flag\") and \"l_measureSetRepID\"\
    \ in str(dat.qualityReports._extra_l_flag).split(\",\"):\n    target = dat.measureSets.measureSetRepID\n\
    else:\n    target = \"\""
