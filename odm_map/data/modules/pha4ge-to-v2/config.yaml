title: PHA4GE to ODM v2

source_schema: schemas/pha4ge.yaml

steps:
  - action: clean
    params:
      schema: schemas/pha4ge.yaml
      operations:
        - format_columns: [ lowercase, { remove_chars: "-"}, alpha_numeric_underscore, single_underscores, trim_underscores ]
        - add_ontology_ids_to_enums: True
        - correct_enums: True
        - remove_unknown_columns: True
  - action: save
    if: "{debug_mode}"
    params:
      output_dir: "{temp_dir}/cleaned_data/"
      output_name: "{class_name}[cleaned].csv"
      progress_bar_title: Saving Cleaned Data
  - action: map
    params:
      source_schema: schemas/pha4ge.yaml
      target_schema: schemas/odm_v2.yaml
      mappers_dir: mappers
  - action: expand
    params:
      config: expander/expander_config.yaml
  - action: filter
    params:
      filters: filters/pha4ge_to_v2_filters.csv
  - action: save
    if: "{debug_mode}"
    params:
      output_dir: "{temp_dir}/mapped_data/"
      output_name: "{class_name}[preid].csv"
  - action: generate_ids
    params:
      id_code:
        - ids/general_v2_id_code.xlsx
        - ids/pha4ge_to_v2_id_code.xlsx
      id_config: ids/general_v2_id_code.yaml
  - action: save
    params:
      output_dir: "{output_dir}"
      output_name: "{class_name}.csv"
      progress_bar_title: Saving Data
