class_derivations:
  samples[000,0000=alternative_isolate_id]:
    name: samples[000,0000=alternative_isolate_id]
    populated_from: PHA4GE
    slot_derivations:
      collType:
        name: collType
        expr: case((collection_device == "", collection_method), (True, collection_device))
      saMaterial:
        name: saMaterial
        populated_from: environmental_material
      repType:
        name: repType
        populated_from: experimental_specimen_role_type
      organizationID:
        name: organizationID
        populated_from: sample_collected_by
      collDT:
        name: collDT
        expr: sample_collection_start_date + '/!/' + sample_collection_start_time
          + '/!/'
      collDTEnd:
        name: collDTEnd
        expr: sample_collection_end_date + '/!/' + sample_collection_end_time + '/!/'
      collDTStart:
        name: collDTStart
        expr: sample_collection_start_date + '/!/' + sample_collection_start_time
          + '/!/'
      recDate:
        name: recDate
        expr: ''''''
      sampleID:
        name: sampleID
        populated_from: alternative_isolate_id
  Container:
    name: Container
    slot_derivations:
      samples[000,0000=alternative_isolate_id]:
        populated_from: PHA4GE
