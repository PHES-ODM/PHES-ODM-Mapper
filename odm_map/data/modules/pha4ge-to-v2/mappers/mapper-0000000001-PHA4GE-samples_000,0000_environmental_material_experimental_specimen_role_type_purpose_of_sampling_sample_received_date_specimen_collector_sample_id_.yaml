class_derivations:
  ? samples[000,0000=environmental_material-experimental_specimen_role_type-purpose_of_sampling-sample_received_date-specimen_collector_sample_id]
  : name: samples[000,0000=environmental_material-experimental_specimen_role_type-purpose_of_sampling-sample_received_date-specimen_collector_sample_id]
    populated_from: PHA4GE
    slot_derivations:
      collType:
        name: collType
        expr: "if len([d for d in emap.collection_device if isinstance(d, str) and\
          \ len(d) > 0]):\n    target = emap.collection_device\nelse:\n    target\
          \ = emap.collection_method"
      saMaterial:
        name: saMaterial
        populated_from: environmental_material
      repType:
        name: repType
        populated_from: experimental_specimen_role_type
      organizationID:
        name: organizationID
        populated_from: sample_collected_by
      collDT:
        name: collDT
        expr: sample_collection_start_date + '/!/' + sample_collection_start_time
          + '/!/'
      collDTEnd:
        name: collDTEnd
        expr: sample_collection_end_date + '/!/' + sample_collection_end_time + '/!/'
      collDTStart:
        name: collDTStart
        expr: sample_collection_start_date + '/!/' + sample_collection_start_time
          + '/!/'
      collAppxT:
        name: collAppxT
        populated_from: sample_collection_time_of_day
      recDate:
        name: recDate
        populated_from: sample_received_date
      pooled:
        name: pooled
        expr: "def is_pooled(values):\n    values = [v.lower().split('[')[0].strip()\
          \ for v in values if isinstance(v, str)]\n    values = [v for v in values\
          \ if v == \"pooling specimens\"]\n    return len(values) > 0\n\ntarget =\
          \ is_pooled(src.specimen_processing)"
      _extra_contactID_tag:
        name: _extra_contactID_tag
        expr: '''sample collected by'''
      _extra_organizationID_tag:
        name: _extra_organizationID_tag
        expr: '''sample collected by'''
      _extra_sampleID_tag:
        name: _extra_sampleID_tag
        expr: '''specimen collector sample ID'''
      sampleID:
        name: sampleID
        populated_from: specimen_collector_sample_id
      _extra_sample_type_tag:
        name: _extra_sample_type_tag
        expr: '''main'''
      purpose:
        name: purpose
        populated_from: purpose_of_sampling
      collPer:
        name: collPer
        expr: "# Convert _value to hours\ntry:\n    _value = float(src.sample_collection_time_duration_value)\n\
          \    _unit = src.sample_collection_time_duration_unit.split(\"[\")[0].strip()\n\
          \    if _unit == \"Second\":\n        target = _value / 60 / 60\n    elif\
          \ _unit == \"Minute\":\n        target = _value / 60\n    elif _unit ==\
          \ \"Hour\":\n        target = _value\n    elif _unit == \"Day\":\n     \
          \   target = _value * 24\n    elif _unit == \"Week\":\n        target =\
          \ _value * 24 * 7\n    elif _unit == \"Month\":\n        target = _value\
          \ * 24 * 7 * 30\n    elif _unit == \"Year\":\n        target = _value *\
          \ 24 * 7 * 365\n    else:\n        target = \"\"\n        raise ValueError(\"\
          Unrecognized value for sample_collection_time_duration_unit in custom mapping\
          \ spreadsheet (for collPer): \" + _unit)\nexcept:\n    target = \"\""
  Container:
    name: Container
    slot_derivations:
      ? samples[000,0000=environmental_material-experimental_specimen_role_type-purpose_of_sampling-sample_received_date-specimen_collector_sample_id]
      : populated_from: PHA4GE
