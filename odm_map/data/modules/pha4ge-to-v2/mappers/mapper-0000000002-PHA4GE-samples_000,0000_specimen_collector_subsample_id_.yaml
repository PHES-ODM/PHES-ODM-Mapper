class_derivations:
  samples[000,0000=specimen_collector_subsample_id]:
    name: samples[000,0000=specimen_collector_subsample_id]
    populated_from: PHA4GE
    slot_derivations:
      collType:
        name: collType
        expr: "if len([d for d in emap.collection_device if len(d) > 0]):\n    target\
          \ = emap.collection_device\nelse:\n    target = emap.collection_method"
      saMaterial:
        name: saMaterial
        populated_from: environmental_material
      repType:
        name: repType
        expr: '"subSamp"'
      organizationID:
        name: organizationID
        populated_from: sample_collected_by
      collDT:
        name: collDT
        expr: sample_collection_start_date + '/!/' + sample_collection_start_time
          + '/!/'
      collDTEnd:
        name: collDTEnd
        expr: sample_collection_end_date + '/!/' + sample_collection_end_time + '/!/'
      collDTStart:
        name: collDTStart
        expr: sample_collection_start_date + '/!/' + sample_collection_start_time
          + '/!/'
      recDate:
        name: recDate
        populated_from: sample_received_date
      _extra_contactID_tag:
        name: _extra_contactID_tag
        expr: '''sample collected by'''
      _extra_organizationID_tag:
        name: _extra_organizationID_tag
        expr: '''sample collected by'''
      _extra_sampleID_tag:
        name: _extra_sampleID_tag
        expr: '''specimen collector subsample ID'''
      sampleID:
        name: sampleID
        populated_from: specimen_collector_subsample_id
  Container:
    name: Container
    slot_derivations:
      samples[000,0000=specimen_collector_subsample_id]:
        populated_from: PHA4GE
