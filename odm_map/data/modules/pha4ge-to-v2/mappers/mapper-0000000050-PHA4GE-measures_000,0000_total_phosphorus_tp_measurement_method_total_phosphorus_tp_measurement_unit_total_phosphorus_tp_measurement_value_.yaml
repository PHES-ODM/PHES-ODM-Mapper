enum_derivations:
  booleanSet:
    name: booleanSet
    mirror_source: false
    populated_from: QualityControlDeterminationMenu
    permissible_value_derivations:
      'True':
        name: 'True'
        sources:
        - no quality control issues identified
        - sequence passed quality control
        - minor quality control issues identified
        - sequence flagged for potential quality control issues
      'False':
        name: 'False'
        populated_from: sequence failed quality control
      nr:
        name: nr
        populated_from: quality control not performed
  NullValueMenu[=mirrored=]:
    name: NullValueMenu[=mirrored=]
    mirror_source: true
    populated_from: NullValueMenu
  ODMv2_enum_from_TotalPhosphorpusTpMeasurementUnitMenu:
    name: ODMv2_enum_from_TotalPhosphorpusTpMeasurementUnitMenu
    mirror_source: false
    populated_from: TotalPhosphorpusTpMeasurementUnitMenu
    permissible_value_derivations:
      gPergTS:
        name: gPergTS
        populated_from: gram per total solids (g/gTS)
      gPO43gTS:
        name: gPO43gTS
        populated_from: "orthophosphate per total solids (gPO43\u2013/gTS)"
      gPO4PgTS:
        name: gPO4PgTS
        populated_from: orthophosphate as phosphorus per total solids (gPO4-P/gTS)
          [GENEPIO:0100998]
      mgPO43L:
        name: mgPO43L
        populated_from: "milligrams orthophosphate per liter (mg PO43\u2013/L)"
      mgPO4PL:
        name: mgPO4PL
        populated_from: milligrams orthophosphate as phosphorus per liter (mg PO4-P/L)
          [GENEPIO:0100999]
      mgL:
