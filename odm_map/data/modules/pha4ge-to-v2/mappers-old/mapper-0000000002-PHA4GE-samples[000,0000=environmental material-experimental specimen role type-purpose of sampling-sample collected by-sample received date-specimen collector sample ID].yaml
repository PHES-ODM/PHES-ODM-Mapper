class_derivations:
  ? samples[000,0000=environmental material-experimental specimen role type-purpose
    of sampling-sample collected by-sample received date-specimen collector sample
    ID]
  : name: samples[000,0000=environmental material-experimental specimen role type-purpose
      of sampling-sample collected by-sample received date-specimen collector sample
      ID]
    populated_from: PHA4GE
    slot_derivations:
      recDate:
        name: recDate
        populated_from: sample_received_date
      sampleID:
        name: sampleID
        populated_from: specimen_collector_sample_ID
      saMaterial:
        name: saMaterial
        populated_from: environmental_material
      repType:
        name: repType
        populated_from: experimental_specimen_role_type
      purposeID:
        name: purposeID
        populated_from: purpose_of_sampling
      organizationID:
        name: organizationID
        populated_from: sample_collected_by
      collPer:
        name: collPer
        expr: "# Convert _value to hours\n_value = src.sample_collection_time_duration_value\n\
          _unit = src.sample_collection_time_duration_unit\nif _unit == \"Second\"\
          :\n    target = _value / 60 / 60\nelif _unit == \"Minute\":\n    target\
          \ = _value / 60\nelif _unit == \"Hour\":\n    target = _value\nelif _unit\
          \ == \"Day\":\n    target = _value * 24\nelif _unit == \"Week\":\n    target\
          \ = _value * 24 * 7\nelif _unit == \"Month\":\n    target = _value * 24\
          \ * 7 * 30\nelif _unit == \"Year\":\n    target = _value * 24 * 7 * 365\n\
          else:\n    target = \"\"\n    raise ValueError(\"Unrecognized value for\
          \ sample_collection_time_duration_unit: \" + _unit)"
      collType:
        name: collType
        expr: case((collection_device != '', collection_device), (True, collection_method))
      collDT:
        name: collDT
        expr: sample_collection_date + '/!/' + sample_collection_start_time
      collDTStart:
        name: collDTStart
        expr: sample_collection_start_time
      collDTEnd:
        name: collDTEnd
        expr: sample_collection_end_date + '/!/' + sample_collection_end_time
  Container:
    name: Container
    slot_derivations:
      ? samples[000,0000=environmental material-experimental specimen role type-purpose
        of sampling-sample collected by-sample received date-specimen collector sample
        ID]
      : populated_from: PHA4GE
