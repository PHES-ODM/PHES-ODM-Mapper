title: ODM v1 to ODM v3

source_schema: "{shared}/schemas/odm_v1.yaml"

steps:
  - action: clean
    params:
      schema: "{shared}/schemas/odm_v1.yaml"
      log_file: "{output_dir}/logs/change_log_input.xlsx"
      operations:
        - format_and_match_columns: True
        - correct_enums: True
  - action: save
    if: "{debug_mode}"
    params:
      output_dir: "{temp}/cleaned_data/"
      output_name: "{class_name}[cleaned].csv"
      progress_bar_title: Saving Cleaned Data
  - action: map
    params:
      source_schema: "{shared}/schemas/odm_v1.yaml"
      target_schema: "{shared}/schemas/odm_v3.yaml"
      mappers_dir: mappers
  - action: clean
    params:
      schema: "{shared}/schemas/odm_v3.yaml"
      operations:
        - correct_enums: True
  - action: save
    if: "{debug_mode}"
    params:
      output_dir: "{temp}/mapped_data/"
      output_name: "{class_name}[preid].csv"
  - action: generate_ids
    params:
      schema: "{shared}/schemas/odm_v3.yaml"
      id_code: 
        - "{shared}/ids/general_v3_id_code.xlsx"
      id_config: 
        - "{shared}/ids/general_v3_id_code.yaml"
  - action: save
    params:
      output_dir: "{output_dir}"
      output_name: "{class_name}.csv"
      progress_bar_title: Saving Data
