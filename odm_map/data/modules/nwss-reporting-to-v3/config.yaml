title: NWSS Reporting to ODM v3

source_schema: schemas/nwss_reporting.yaml

steps:
  - action: clean
    params:
      schema: schemas/nwss_reporting.yaml
      log_file: "{output_dir}/logs/change_log_input.xlsx"
      operations:
        - format_and_match_columns: True
        - correct_enums: True
  - action: save
    if: "{debug_mode}"
    params:
      output_dir: "{temp}/cleaned_data/"
      output_name: "{class_name}[cleaned].csv"
      progress_bar_title: Saving Cleaned Data
  - action: map
    params:
      source_schema: schemas/nwss_reporting.yaml
      target_schema: "{shared}/schemas/odm_v3.yaml"
      mappers_dir: mappers
  - action: filter
    params:
      filters: filters/nwss_reporting_to_v3_filters.csv
  - action: save
    if: "{debug_mode}"
    params:
      output_dir: "{temp}/mapped_data/"
      output_name: "{class_name}[preid].csv"
  - action: generate_ids
    params:
      schema: "{shared}/schemas/odm_v3.yaml"
      id_code: 
        - "{shared}/ids/general_v3_id_code.xlsx"
        - ids/nwss_reporting_to_v3_id_code.xlsx
      id_config: 
        - "{shared}/ids/general_v3_id_code.yaml"
        - "ids/nwss_reporting_to_v3_id_code.yaml"
  - action: clean
    params:
      schema: "{shared}/schemas/odm_v3.yaml"
      operations:
        - correct_enums: True
  - action: filter
    params:
      filters: "{shared}/filters/odm_vx_filter_required_values.csv"
      mark_instead_of_drop: "{debug_mode}"
  - action: drop_columns
    if: "{not_debug_mode}"
    params:
      keep_columns_in_schema_only: True
      schema: "{shared}/schemas/odm_v3.yaml"
  - action: save
    params:
      output_dir: "{output_dir}"
      output_name: "{class_name}.csv"
      progress_bar_title: Saving Data
