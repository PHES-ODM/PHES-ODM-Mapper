class_derivations:
  samples:
    name: samples
    populated_from: nwss
    slot_derivations:
      collPer:
        name: collPer
        expr: "def get_collPer(sample_type: str) -> str:\n    # Example sample_type:\
          \ \"24-hr flow-weighted composite\"\n    hours = sample_type.split(\" \"\
          , maxsplit=1)[0]\n    hours = hours.split(\"-hr\")\n    if len(hours) ==\
          \ 2:\n        hours = hours[0]\n        return hours\n    return \"\"\n\
          target = get_collPer(src.sample_type)"
      collType:
        name: collType
        expr: "def get_collType(sample_type: str) -> str:\n    # Example sample_type:\
          \ \"24-hr flow-weighted composite\"\n    if sample_type == \"grab\":\n \
          \       return \"grb\"\n    elif sample_type.endswith(\"flow-weighted composite\"\
          ):\n        return \"flowPr\"\n    elif sample_type.endswith(\"time-weighted\
          \ composite\"):\n        return \"timePr\"\n    elif sample_type.endswith(\"\
          manual composite\"):\n        return \"manComp\"\n    elif sample_type.endswith(\"\
          passive sample\"):\n        return \"passiveGen\"\n    return \"\"\ntarget\
          \ = get_collType(src.sample_type)"
      collNum:
        name: collNum
        populated_from: composite_freq
      reportable:
        name: reportable
        expr: case(((dashboard_ignore == 'yes') + (analysis_ignore == 'yes'), 'false'),
          (True, 'true'))
      organizationID:
        name: organizationID
        populated_from: lab_id
      contactID:
        name: contactID
        populated_from: reporting_jurisdiction
      sampleID:
        name: sampleID
        populated_from: sample_id
      siteID:
        name: siteID
        populated_from: site_id
      protocolID:
        name: protocolID
        populated_from: major_lab_method
      collDT:
        name: collDT
        expr: sample_collect_date + '/' + sample_collect_time + '/' + time_zone
      datasetID:
        name: datasetID
        populated_from: lab_id
      saMaterial:
        name: saMaterial
        populated_from: sample_matrix
  Container:
    name: Container
    slot_derivations:
      samples:
        populated_from: nwss
enum_derivations:
  vs_reporting_jurisdiction[=mirrored=]:
    name: vs_reporting_jurisdiction[=mirrored=]
    mirror_source: true
    populated_from: vs_reporting_jurisdiction
  sampleMatSet:
    name: sampleMatSet
    mirror_source: false
    populated_from: vs_sample_matrix
    permissible_value_derivations:
      rawWW:
        name: rawWW
        populated_from: raw wastewater
      pstGrit:
        name: pstGrit
        populated_from: post grit removal
      pSludge:
        name: pSludge
        populated_from: primary sludge
      pEfflu:
        name: pEfflu
        populated_from: primary effluent
      sSludge:
        name: sSludge
        populated_from: secondary sludge
      sEfflu:
        name: sEfflu
        populated_from: secondary effluent
      septage:
        name: septage
        populated_from: septage
      htSam:
        name: htSam
        populated_from: holding tank
